name: Upstream sync

# Only in the fork codeministry/erpnext_germanized, never meant for upstream. Every day (or on demand) it merges
# the newest release tag of encircle360-oss/erpnext_germanized straight into the branch fork, without a pull
# request, and starts fork-image.yml, which builds and tests <version>-cm1. CHANGELOG.md and README.md always take
# upstream's version: the fork keeps its own notes in FORK.md. Any other conflict fails the run, pushes nothing and
# opens an issue naming the tag and the files. See FORK.md.
#
# A second job checks whether upstream already ships what the fork exists for; once it does, the fork can go.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/encircle360-oss/erpnext_germanized.git
  BASE: fork
  LABEL: upstream-sync
  ASSIGNEE: codeministry
  # Files upstream rewrites with every release and the fork never needs to change.
  TAKE_UPSTREAM: CHANGELOG.md README.md

jobs:
  sync:
    name: Merge the newest upstream tag
    if: github.repository == 'codeministry/erpnext_germanized'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # push the merge onto the branch fork
      actions: write # start fork-image.yml, which a push with the workflow token would not
      issues: write # report a merge conflict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the newest upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          if [[ -z $newest ]]; then
            echo "::error::No release tag found at $UPSTREAM_REPO."
            exit 1
          fi
          merged=$(tr -d '[:space:]' < fork/upstream-tag)
          {
            echo "newest=$newest"
            echo "merged=$merged"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream sync"
            echo
            echo "- newest upstream tag: \`$newest\`"
            echo "- merged into $BASE: \`$merged\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge the tag into the sync branch
        id: merge
        if: steps.tag.outputs.newest != steps.tag.outputs.merged
        env:
          NEWEST: ${{ steps.tag.outputs.newest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet --no-tags "$UPSTREAM_REPO" "refs/tags/$NEWEST:refs/upstream/$NEWEST"
          git merge --no-ff --no-commit "refs/upstream/$NEWEST" || true
          for file in $TAKE_UPSTREAM; do
            if git cat-file -e "refs/upstream/$NEWEST:$file" 2> /dev/null; then
              git checkout "refs/upstream/$NEWEST" -- "$file"
              git add -- "$file"
            fi
          done
          conflicts=$(git diff --name-only --diff-filter=U)
          if [[ -n $conflicts ]]; then
            {
              echo 'conflicts<<EOF'
              echo "$conflicts"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::Merging $NEWEST conflicts in: $(echo "$conflicts" | tr '\n' ' ')"
            exit 1
          fi
          printf '%s\n' "$NEWEST" > fork/upstream-tag
          git add fork/upstream-tag
          git commit --quiet -m "merge upstream $NEWEST"
          echo "merged $NEWEST onto $(git rev-parse --short HEAD~1)"

      - name: Report the conflict
        if: failure() && steps.merge.outputs.conflicts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.tag.outputs.newest }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          title="Upstream-Sync $NEWEST: Konflikt beim Merge"
          if gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --search "in:title \"$title\"" \
            --json number --jq '.[].number' | grep -q .; then
            echo "an open issue already reports $NEWEST"
            exit 0
          fi
          body=$(
            echo "Der Merge von \`$NEWEST\` in \`$BASE\` hat Konflikte in Dateien, die der Fork selbst ändert:"
            echo
            while IFS= read -r file; do echo "- \`$file\`"; done <<< "$CONFLICTS"
            echo
            echo "Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Der Lauf hat nichts gepusht. Lösen, wie in FORK.md unter „Konflikte“ beschrieben:"
            echo "\`$NEWEST\` in \`$BASE\` mergen, Konflikte lösen, \`fork/upstream-tag\` auf \`$NEWEST\` setzen,"
            echo "nach \`$BASE\` pushen und \`gh workflow run fork-image.yml --ref $BASE\` starten."
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
            --label "$LABEL" --assignee "$ASSIGNEE"

      - name: Push the merge onto fork and start the image build
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.tag.outputs.newest }}
        run: |
          # A plain push, never forced: if fork moved since the checkout, the push fails and tomorrow's run retries.
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BASE"
          gh workflow run fork-image.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
          echo "merged $NEWEST onto $BASE, fork-image.yml builds ${NEWEST#v}-cm1" | tee -a "$GITHUB_STEP_SUMMARY"

  exit-condition:
    name: Check whether the fork can go
    if: github.repository == 'codeministry/erpnext_germanized'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check the newest upstream release
        run: |
          # The fork exists for the apps in fork/extra-apps.json (Frappe Insights). Once upstream's newest release
          # lists all of them in its apps.json, the operator can go back to the upstream image (FORK.md).
          newest=$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          git init --quiet upstream
          git -C upstream fetch --quiet --depth 1 --no-tags "$UPSTREAM_REPO" "refs/tags/$newest:refs/tags/$newest"
          upstream_apps=$(git -C upstream show "$newest:apps.json" | jq -r '.[].url')
          extra=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BASE/fork/extra-apps.json" | jq -r '.[].url')
          all=erfüllt
          lines=""
          while IFS= read -r url; do
            if grep -qxF "$url" <<< "$upstream_apps"; then state=erfüllt; else state=offen; all=offen; fi
            lines+="Ausstieg: $url in apps.json von upstream $newest: $state"$'\n'
          done <<< "$extra"
          printf '%sAusstieg: %s (upstream %s)\n' "$lines" "$all" "$newest" | tee -a "$GITHUB_STEP_SUMMARY"
