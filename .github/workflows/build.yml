name: Image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - apps.json
      - build.sh
      - germanized/**
      - tests/site/**
      - LICENSES/**
      - .github/actions/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Containerfile
      - apps.json
      - build.sh
      - germanized/**
      - tests/site/**
      - LICENSES/**
      - .github/actions/**
      - .github/workflows/build.yml
  workflow_dispatch:
  # release.yml builds, tests and publishes a release with this workflow.
  workflow_call:
    outputs:
      tags:
        description: The image tags the release was pushed with, separated by commas
        value: ${{ jobs.publish.outputs.tags }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/encircle360-oss/erpnext_germanized
  BUILD_CACHE: ghcr.io/encircle360-oss/erpnext_germanized:buildcache
  LOCAL_TAG: erpnext_germanized:ci

jobs:
  test:
    name: Build and test
    # Pull requests, runs by hand and forks build and test without publishing, with a token that can write
    # nothing but the scan.
    if: github.event_name != 'push' || github.repository != 'encircle360-oss/erpnext_germanized'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload the vulnerability scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags for the version label.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build, test and scan the image
        uses: $/.github/actions/build-and-test
        with:
          local-tag: ${{ env.LOCAL_TAG }}
          build-cache: ${{ env.BUILD_CACHE }}

      - name: Write the summary
        run: python -m germanized summary >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build, test and publish
    # Only pushes publish: to main, and of a release tag after release.yml has checked it. A called workflow
    # sees the event of its caller.
    if: github.event_name == 'push' && github.repository == 'encircle360-oss/erpnext_germanized'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image and the build cache
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
      security-events: write # upload the vulnerability scan
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags for the version label, the moving tags the releases.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Plan the image tags
        id: tags
        run: |
          tags=$(python -m germanized tags --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --existing "$(git tag -l 'v*')")
          if [[ -z $tags ]]; then
            echo "::error::$GITHUB_REF has no image tags to publish."
            exit 1
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing $tags"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build, test and scan the image
        id: image
        uses: $/.github/actions/build-and-test
        with:
          local-tag: ${{ env.LOCAL_TAG }}
          build-cache: ${{ env.BUILD_CACHE }}
          push-to: ${{ env.IMAGE }}
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }},mode=max,ignore-error=true

      - name: Check that the pushed image is the tested one
        # The tags go to the pushed digest only if it is the image that passed the site test.
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          tested=$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          config=$(jq --raw-output .config.digest <<< "$manifest")
          # The ID of an image is the digest of its manifest in the containerd image store of Docker and the
          # digest of its config in the classic one.
          if [[ $tested != "$DIGEST" && $tested != "$config" ]]; then
            echo "::error::$IMAGE@$DIGEST is not the tested image $tested."
            exit 1
          fi

      - name: Tag the tested image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=, read -ra refs <<< "$TAGS"
          tag_args=()
          for ref in "${refs[@]}"; do
            tag_args+=(--tag "$ref")
          done
          # Every tag gets the manifest itself, not an index around it with a digest of its own.
          docker buildx imagetools create --prefer-index=false "${tag_args[@]}" "$IMAGE@$DIGEST"
          for ref in "${refs[@]}"; do
            manifest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref")
            if [[ $(jq --raw-output .digest <<< "$manifest") != "$DIGEST" ]]; then
              echo "::error::$ref does not name the tested image $IMAGE@$DIGEST."
              exit 1
            fi
          done

      - name: Attest the build provenance
        if: steps.image.outputs.public == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Create the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          artifact-name: erpnext_germanized.spdx.json
          upload-release-assets: false

      - name: Write the summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: python -m germanized summary --tags "$TAGS" >> "$GITHUB_STEP_SUMMARY"
