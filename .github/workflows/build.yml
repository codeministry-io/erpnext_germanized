name: Image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - apps.json
      - build.sh
      - tests/site/**
      - LICENSES/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Containerfile
      - apps.json
      - build.sh
      - tests/site/**
      - LICENSES/**
      - .github/workflows/build.yml
  workflow_dispatch:
  # release.yml builds, tests and publishes a release with this workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/encircle360-oss/erpnext_germanized
  BUILD_CACHE: ghcr.io/encircle360-oss/erpnext_germanized:buildcache
  LOCAL_TAG: erpnext_germanized:ci

jobs:
  image:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image and the build cache
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
      security-events: write # upload the vulnerability scan
    steps:
      - name: Free disk space
        # The bench, the build cache and the loaded image need more space than the runner has free; these
        # toolchains are not used here.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags for the version label.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate apps.json
        run: python -m germanized validate

      - name: Plan the build
        # Only main and release tags of this repository publish; pull requests never log in or push.
        id: plan
        run: |
          tags=$(python -m germanized tags --ref "$GITHUB_REF" --sha "$GITHUB_SHA")
          # build-push-action and the summary both take the tags separated by commas.
          tags=${tags//$'\n'/,}
          publish=false
          if [[ -n $tags && $GITHUB_EVENT_NAME != pull_request && $GITHUB_REPOSITORY == encircle360-oss/erpnext_germanized ]]; then
            publish=true
          fi
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            version=$GITHUB_REF_NAME
          else
            version=$(git describe --tags --always --dirty)
          fi
          {
            # The apps.json secret is not part of the build cache key, its checksum is.
            echo "cache-bust=$(sha256sum apps.json | cut -c1-16)"
            echo "version=$version"
            echo "publish=$publish"
            if [[ $publish == true ]]; then
              echo "cache-to=type=registry,ref=$BUILD_CACHE,mode=max,ignore-error=true"
              echo "tags=$tags"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish: ${tags:-no tags}"

      - name: Check whether code scanning and attestations are available
        # Both are free for public repositories only, and pull requests from forks cannot upload scans.
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          public=false
          code_scanning=false
          if [[ $(gh api "repos/$GITHUB_REPOSITORY" --jq .private) == false ]]; then
            public=true
            if [[ $GITHUB_EVENT_NAME != pull_request || $HEAD_REPOSITORY == "$GITHUB_REPOSITORY" ]]; then
              code_scanning=true
            fi
          fi
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "code-scanning=$code_scanning" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          secret-files: apps_json=./apps.json
          build-args: |
            CACHE_BUST=${{ steps.plan.outputs.cache-bust }}
            VERSION=${{ steps.plan.outputs.version }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}
          cache-to: ${{ steps.plan.outputs.cache-to }}
          # The provenance comes from the attestation below.
          provenance: false
          load: true
          tags: ${{ env.LOCAL_TAG }}

      - name: Install every app on a fresh site
        timeout-minutes: 25
        run: ./tests/site/run.sh "$LOCAL_TAG"

      - name: Scan the image for vulnerabilities
        # A report, not a gate: the findings come from Debian and the upstream apps and are fixed by a rebuild
        # or an update, so neither they nor a failing scanner stop the image.
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'
          timeout: 15m
          format: ${{ steps.visibility.outputs.code-scanning == 'true' && 'sarif' || 'table' }}
          output: ${{ steps.visibility.outputs.code-scanning == 'true' && 'trivy-image.sarif' || '' }}
          limit-severities-for-sarif: true

      - name: Upload the findings to code scanning
        if: steps.scan.outcome == 'success' && steps.visibility.outputs.code-scanning == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Push the image
        # The same build again; every layer comes from the cache of the build above.
        id: push
        if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          secret-files: apps_json=./apps.json
          build-args: |
            CACHE_BUST=${{ steps.plan.outputs.cache-bust }}
            VERSION=${{ steps.plan.outputs.version }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}
          provenance: false
          push: true
          tags: ${{ steps.plan.outputs.tags }}

      - name: Check that the pushed image is the tested one
        # A layer the push had to build again would not have been through the site test.
        if: steps.plan.outputs.publish == 'true'
        env:
          PUSHED: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          tested=$(docker image inspect --format '{{json .RootFS.Layers}}' "$LOCAL_TAG")
          pushed=$(docker buildx imagetools inspect --format '{{json .Image.RootFS.DiffIDs}}' "$PUSHED")
          if ! jq --null-input --exit-status --argjson tested "$tested" --argjson pushed "$pushed" \
            '$tested | length > 0 and . == $pushed' > /dev/null; then
            echo "::error::$PUSHED has other layers than the tested image."
            exit 1
          fi

      - name: Attest the build provenance
        if: steps.plan.outputs.publish == 'true' && steps.visibility.outputs.public == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Create the SBOM
        if: steps.plan.outputs.publish == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          artifact-name: erpnext_germanized.spdx.json
          upload-release-assets: false

      - name: Write the summary
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
        run: python -m germanized summary --tags "$TAGS" >> "$GITHUB_STEP_SUMMARY"
