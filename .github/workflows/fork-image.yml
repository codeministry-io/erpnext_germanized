name: Fork test image

# Only in the fork codeministry-io/erpnext_germanized, never meant for upstream: builds the recipe natively for
# linux/arm64, runs the site test and pushes the tested image as a single manifest (no index, no provenance), so a
# vulnerability scanner sees exactly the image that runs. See FORK.md for why the fork exists and when it can go.
#
# The tag is <upstream version>-cm<n>: the version comes from fork/upstream-tag, which only the upstream sync
# writes; n counts the builds of that version. Every pushed image gets an annotated git tag cm/<tag> whose
# message names the run, created only after the push, so the git tags list exactly the published images.
# A push to the branch fork builds, and so does a dispatch from upstream-sync.yml after it merged a new tag (a push
# made with the workflow token starts no other workflow); so does the weekly schedule, which rebuilds the same state as the next revision
# to pick up the packages the recipe installs.
on:
  push:
    branches: [fork]
    paths-ignore: [FORK.md, renovate.json]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/codeministry-io/erpnext_germanized
  LOCAL_TAG: erpnext_germanized:ci

jobs:
  image:
    name: Build, test and push (arm64)
    if: github.repository == 'codeministry-io/erpnext_germanized'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: write # push the git tag cm/<tag>
      packages: write # push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Validate apps.json and plan the build
        id: plan
        run: |
          python -m germanized validate
          # The apps the fork adds on top of upstream (fork/extra-apps.json, today Frappe Insights for
          # cm-k8s-cluster spec 018). They are appended only here, in the runner's copy, after upstream's apps.json
          # passed its own validation, so the committed apps.json stays upstream's and the daily sync never
          # conflicts on it. Build and site test both read this copy.
          jq -s '.[0] + .[1]' apps.json fork/extra-apps.json > apps.json.new
          mv apps.json.new apps.json
          jq -r '.[] | "app: \(.url) \(.branch)"' apps.json
          upstream=$(tr -d '[:space:]' < fork/upstream-tag)
          if [[ ! $upstream =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::fork/upstream-tag holds '$upstream', not a release tag like v16.60.0-7."
            exit 1
          fi
          version=${upstream#v}
          # CHANGELOG.md always holds upstream's version (the sync takes it from the tag). Its newest release must be
          # the tag in fork/upstream-tag; otherwise upstream was merged some other way, for example with GitHub's
          # "Sync fork" button, and the image would carry a version its code is not.
          changelog=$(grep -m 1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [[ "v$changelog" != "$upstream" ]]; then
            echo "::error::fork/upstream-tag says $upstream, but CHANGELOG.md is at v$changelog. Merge upstream only through upstream-sync.yml (FORK.md)."
            exit 1
          fi
          last=$(git tag -l "cm/$version-cm*" | sed 's/.*-cm//' | sort -n | tail -n 1)
          tag="$version-cm$(( ${last:-0} + 1 ))"
          {
            echo "cache-bust=$(sha256sum apps.json | cut -c1-16)"
            echo "version=$tag"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "building $tag from $upstream"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          secret-files: apps_json=./apps.json
          build-args: |
            CACHE_BUST=${{ steps.plan.outputs.cache-bust }}
            VERSION=${{ steps.plan.outputs.version }}
          # The package is linked to this fork, not to upstream.
          labels: org.opencontainers.image.source=https://github.com/codeministry-io/erpnext_germanized
          provenance: false
          load: true
          tags: ${{ env.LOCAL_TAG }}

      - name: Install every app on a fresh site
        run: ./tests/site/run.sh "$LOCAL_TAG"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the tested image
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          docker tag "$LOCAL_TAG" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          {
            echo "### Pushed"
            echo
            echo "\`$IMAGE:$TAG\` ($(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG"))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "cm/$TAG" -m "run $GITHUB_RUN_ID" "$GITHUB_SHA"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/cm/$TAG"
