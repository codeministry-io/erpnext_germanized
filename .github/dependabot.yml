version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week gives a compromised release time to be noticed and pulled before it lands here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: []

  # The first FROM of the Containerfile. Its ARGs PYTHON_VERSION and DEBIAN_BASE follow by hand; the tests
  # fail until they agree with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Frappe 16 runs on Python 3.14; a newer minor or major version of the base image is a decision, not
      # an update, and the tests fail until the ARGs follow it.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    labels: []

  # The database and Redis images of the site test and of the example.
  - package-ecosystem: docker-compose
    directories:
      - /tests/site
      - /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The database and Redis of the site test and the example follow what frappe_docker supports; a new
      # major version is a decision, not an update.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: []

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: []
