version: 2

# ruff and zizmor are pinned twice, in requirements-dev.txt and as pre-commit hooks. One pull request for
# both ecosystems moves them together; the tests fail while the two pins disagree.
multi-ecosystem-groups:
  development-tools:
    schedule:
      interval: weekly

updates:
  # The workflows and the composite actions they share.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A week gives a compromised release time to be noticed and pulled before it lands here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: []

  # The first FROM of the Containerfile, by tag and digest. Its ARGs PYTHON_VERSION and DEBIAN_BASE follow
  # by hand; the tests fail until they agree with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Frappe 16 runs on Python 3.14; a newer minor or major version of the base image is a decision, not
      # an update, and the tests fail until the ARGs follow it.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    labels: []

  # The database and Redis images of the site test and of the example.
  - package-ecosystem: docker-compose
    directories:
      - /tests/site
      - /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The database and Redis of the site test and the example follow what frappe_docker supports; a new
      # major version is a decision, not an update.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The example runs the image of this repository on its moving tag 16 on purpose. Dependabot names the
      # image without its registry.
      - dependency-name: encircle360-oss/erpnext_germanized
    labels: []

  - package-ecosystem: pip
    directory: /
    multi-ecosystem-group: development-tools
    patterns: ['*']
    cooldown:
      default-days: 7
    labels: []

  - package-ecosystem: pre-commit
    directory: /
    multi-ecosystem-group: development-tools
    patterns: ['*']
    cooldown:
      default-days: 7
    labels: []
