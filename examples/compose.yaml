# erpnext_germanized with docker compose: one site with every app of the image.
#
# Based on pwd.yml of frappe_docker v4.2.0 (https://github.com/frappe/frappe_docker), with the image of
# this repository, one place for the image and one for the site settings, and all apps on the new site.
#
# Replace every CHANGE_ME under x-site before the first start. MariaDB keeps the root password of its
# first start in the volume db-data, and create-site sets the Administrator password only once, so a
# later change here changes neither.
#
# The tag 16 moves with every release. For a lasting installation pin a full release tag such as
# 16.60.0-1 and update on purpose, see docs/versionierung.md and docs/betrieb.md.
#
# Docker pulls the image for the platform of this machine, linux/amd64 or linux/arm64. ERiC for Steuerbote
# runs on linux/amd64 only, see docs/apps.md.

name: erpnext_germanized

x-erpnext: &erpnext
  image: ghcr.io/encircle360-oss/erpnext_germanized:16
  networks:
    - frappe_network

x-site:
  name: &site_name erp.localhost
  db-root-password: &db_root_password CHANGE_ME
  admin-password: &admin_password CHANGE_ME

services:
  backend:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    # chromium_path points Frappe at the Chromium of the image; without it, the first PDF made with the
    # generator "chrome", the default of the print settings, makes Frappe download Chromium into the bench.
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    # The apps follow the order of apps.json, which is the order they install in. bench knows
    # erpnext_pdf-on-submit by its module name pdf_on_submit. Language and country are chosen in the
    # setup wizard after the first login, because bench new-site has no option for them.
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' \
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app erpnext \
            --install-app hrms \
            --install-app erpnext_germany \
            --install-app erpnext_datev \
            --install-app eu_einvoice \
            --install-app pdf_on_submit \
            --install-app banking \
            --install-app insights \
            --install-app steuerbote \
            --set-default "$$SITE_NAME";
        fi;
    environment:
      SITE_NAME: *site_name
      DB_ROOT_PASSWORD: *db_root_password
      ADMIN_PASSWORD: *admin_password

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: *db_root_password
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    <<: *erpnext
    depends_on:
      - websocket
      - backend
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    # FRAPPE_SITE_NAME_HEADER serves the one site of this file under any host name, such as localhost.
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: *site_name
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"

  queue-long:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: *erpnext
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
